    const priceRows = [
        { price: 259, badge: "HOT", weekendPrice: null },
        { price: 219, badge: null, weekendPrice: null },
        { price: 139, badge: null, weekendPrice: null },
        { price: 115, badge: null, weekendPrice: 225 },
        { price: 99, badge: null, weekendPrice: null },
        { price: 85, badge: null, weekendPrice: null },
        { price: 59, badge: null, weekendPrice: null }
    ];

    let currentLang = 'en';
    let timerInterval = null;
    let dateTimeInterval = null;

    function localizeDateTime(lang) {
        const now = new Date();
        const vnTime = new Date(now.toLocaleString("en-US", {timeZone: "Asia/Ho_Chi_Minh"}));
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
        let formatted = vnTime.toLocaleString(lang === 'zh' ? 'zh-CN' : (lang === 'pt' ? 'pt-BR' : (lang === 'hi' ? 'hi-IN' : (lang === 'ru' ? 'ru-RU' : 'en-US'))), options);
        if (lang === 'zh') formatted = formatted.replace('上午', '早上').replace('下午', '下午');
        return `🇻🇳 ${formatted}`;
    }

    function updateDateTime() {
        const bar = document.getElementById('datetimeBar');
        if (bar) bar.textContent = localizeDateTime(currentLang);
    }

    function buildTable(lang) {
        const t = translations[lang];
        const thead = document.getElementById('tableHeader');
        const tbody = document.getElementById('tableBody');
        thead.innerHTML = `<tr><th>${t.speed_th}</th><th>${t.price_th}</th><th>${t.avail_th}</th></tr>`;
        tbody.innerHTML = '';
        for (let i = 0; i < priceRows.length; i++) {
            const row = priceRows[i];
            let priceHtml = `<strong>$${row.price}</strong>`;
            if (row.weekendPrice) {
                priceHtml += ` <span class="weekend-badge">$${row.weekendPrice} ${t.weekend_label}</span>`;
            }
            let speedHtml = t.speeds[i];
            if (row.badge) speedHtml += ` <span class="urgency-badge">${row.badge}</span>`;
            const availHtml = t.avail[i];
            const tr = document.createElement('tr');
            tr.innerHTML = `<td>${speedHtml}</td><td>${priceHtml}</td><td>${availHtml}</td>`;
            tbody.appendChild(tr);
        }
    }

    function renderPage(lang) {
        const t = translations[lang];
        if (!t) return;
        document.getElementById('subhead').textContent = t.subhead;
        document.getElementById('aiTitle').innerHTML = t.ai_title;
        document.getElementById('aiDesc').textContent = t.ai_desc;
        document.getElementById('timerLabel').textContent = t.timer_label;
        document.getElementById('ctaButton').textContent = t.cta_button;
        document.getElementById('visaNote').textContent = t.visa_note;
        document.getElementById('tableTitle').textContent = t.table_title;
        document.getElementById('govFeeNote').textContent = t.gov_fee_note;
        document.getElementById('extraFeeNote').textContent = t.extra_fee_note;
        document.getElementById('paymentNote').textContent = t.payment_note;
        document.getElementById('savedTitle').textContent = t.saved_title;
        document.getElementById('stepsTitle').textContent = t.steps_title;
        document.getElementById('stepsList').innerHTML = `${t.step1}<br>${t.step2}<br>${t.step3}<br>${t.step4}`;
        document.getElementById('privacyText').innerHTML = t.privacy;
        document.getElementById('faqTitle').textContent = t.faq_title;
        const faqContainer = document.getElementById('faqContainer');
        faqContainer.innerHTML = '';
        for (const item of t.faq) {
            const div = document.createElement('div');
            div.className = 'faq-item';
            div.innerHTML = `<div class="faq-question">${item.q}</div><p>${item.a}</p>`;
            faqContainer.appendChild(div);
        }
        document.getElementById('supportTitle').textContent = t.support_title;
        document.getElementById('supportNote').textContent = t.support_note;
        document.getElementById('chatLink').innerHTML = `💬 ${t.chat_text}`;
        document.getElementById('footerText').innerHTML = t.footer;
        buildTable(lang);
        const footerSwitch = document.getElementById('langSwitchFooter');
        footerSwitch.innerHTML = `
            <button class="lang-btn" data-lang="en">🇬🇧 EN</button>
            <button class="lang-btn" data-lang="ru">🇷🇺 RU</button>

            <button class="lang-btn" data-lang="pt">🇧🇷 PT</button>
            <button class="lang-btn" data-lang="hi">🇮🇳 हिंदी</button>
        `;
        document.querySelectorAll('.lang-btn').forEach(btn => {
            if (btn.getAttribute('data-lang') === lang) btn.classList.add('active');
            btn.addEventListener('click', () => {
                const newLang = btn.getAttribute('data-lang');
                if (translations[newLang]) {
                    currentLang = newLang;
                    localStorage.setItem('click2visa_lang', currentLang);
                    renderPage(currentLang);
                    if (timerInterval) clearInterval(timerInterval);
                    if (dateTimeInterval) clearInterval(dateTimeInterval);
                    updateTimer();
                    updateDateTime();
                    timerInterval = setInterval(updateTimer, 1000);
                    dateTimeInterval = setInterval(updateDateTime, 1000);
                }
            });
        });
        updateTimer();
    }

    function updateTimer() {
        const now = new Date();
        const vnTime = new Date(now.toLocaleString("en-US", {timeZone: "Asia/Ho_Chi_Minh"}));
        const day = vnTime.getDay();
        const timerEl = document.getElementById('deadlineTimer');
        const noteEl = document.getElementById('timerNote');
        if (!timerEl) return;
        const t = translations[currentLang];
        const isWeekend = (day === 0 || day === 6);
        if (isWeekend) {
            timerEl.textContent = t.weekend_label === 'weekend' ? 'Weekend / Holiday' : (t.weekend_label === 'выходные' ? 'Выходные / Праздник' : (t.weekend_label === '周末' ? '周末 / 节假日' : (t.weekend_label === 'fim de semana' ? 'Fim de semana / Feriado' : 'सप्ताहांत / अवकाश')));
            timerEl.style.color = '#ff6b2b';
            let msg = '';
            if (currentLang === 'ru') msg = '⚡ <strong>Только 1‑дневная обработка ($225).</strong> ИИ работает 24/7.';
            else if (currentLang === 'zh') msg = '⚡ <strong>仅提供1天加急服务（$225）。</strong> AI全天候工作。';
            else if (currentLang === 'pt') msg = '⚡ <strong>Apenas processamento de 1 dia ($225).</strong> IA funciona 24/7.';
            else if (currentLang === 'hi') msg = '⚡ <strong>केवल 1-दिवसीय प्रसंस्करण ($225)।</strong> AI 24/7 काम करता है।';
            else msg = '⚡ <strong>Only 1‑day processing ($225).</strong> AI works 24/7.';
            noteEl.innerHTML = msg;
            return;
        }
        const deadline1 = new Date(vnTime);
        deadline1.setHours(10, 0, 0, 0);
        const deadline2 = new Date(vnTime);
        deadline2.setHours(15, 0, 0, 0);
        let target = deadline1;
        if (vnTime > deadline1) target = deadline2;
        if (vnTime > deadline2) {
            timerEl.textContent = 'Slots closed today.';
            let msg = '';
            if (currentLang === 'ru') msg = 'Следующий слот завтра с 8:00 (время Вьетнама).';
            else if (currentLang === 'zh') msg = '下一个时段为明天上午8:00（越南时间）。';
            else if (currentLang === 'pt') msg = 'Próximo horário amanhã às 8:00 (horário do Vietnã).';
            else if (currentLang === 'hi') msg = 'अगला स्लॉट कल सुबह 8:00 बजे (वियतनाम समय)।';
            else msg = 'Next opening tomorrow 8:00 AM (VN time).';
            noteEl.innerHTML = msg;
            return;
        }
        const diff = target - vnTime;
        const hours = Math.floor(diff / (1000 * 60 * 60));
        const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((diff % (1000 * 60)) / 1000);
        timerEl.textContent = `${hours.toString().padStart(2,'0')}:${minutes.toString().padStart(2,'0')}:${seconds.toString().padStart(2,'0')}`;
        timerEl.style.color = '#ff6b2b';
        let msg = '';
        if (currentLang === 'ru') msg = 'Заявки, поданные до 10:00 или 15:00 (время Вьетнама), обрабатываются сегодня.';
        else if (currentLang === 'zh') msg = '在越南时间10:00或15:00前提交的申请将在当天处理。';
        else if (currentLang === 'pt') msg = 'Pedidos enviados antes das 10:00 ou 15:00 (horário do Vietnã) são processados hoje.';
        else if (currentLang === 'hi') msg = 'आज सुबह 10:00 बजे या दोपहर 3:00 बजे (वियतनाम समय) से पहले जमा किए गए आवेदन आज ही संसाधित किए जाएंगे।';
        else msg = 'All applications submitted before 10:00 AM or 3:00 PM (VN time) are processed today.';
        noteEl.innerHTML = msg;
    }

    function detectLanguage() {
        const saved = localStorage.getItem('click2visa_lang');
        if (saved && translations[saved]) return saved;
        const browserLang = navigator.language || navigator.userLanguage;
        const langCode = browserLang.split('-')[0].toLowerCase();
        if (langCode === 'ru') return 'ru';
        if (langCode === 'zh') return 'zh';
        if (langCode === 'pt') return 'pt';
        if (langCode === 'hi') return 'hi';
        return 'en';
    }

    currentLang = detectLanguage();
    renderPage(currentLang);
    updateDateTime();
    if (timerInterval) clearInterval(timerInterval);
    if (dateTimeInterval) clearInterval(dateTimeInterval);
    timerInterval = setInterval(updateTimer, 1000);
    dateTimeInterval = setInterval(updateDateTime, 1000);
